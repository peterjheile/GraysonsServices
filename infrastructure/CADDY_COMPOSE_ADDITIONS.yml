services:
  caddy:
    volumes:
      - graysons_services_public_media:/srv/graysons-services/media:ro
    networks:
      - caddy_proxy

networks:
  caddy_proxy:
    external: true
    name: REPLACE_WITH_EXISTING_CADDY_NETWORK

volumes:
  graysons_services_public_media:
    external: true
    name: graysons-services-public-media